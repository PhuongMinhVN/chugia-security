<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="emGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bgShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E"/>
      <stop offset="100%" stop-color="#081A2E"/>
    </linearGradient>
    <linearGradient id="cyanG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Circular Ring (Thuy-Moc Harmony) -->
  <circle cx="32" cy="32" r="30.5" fill="#040914" stroke="#10B981" stroke-width="1.8"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#00E5FF" stroke-width="0.8" opacity="0.6"/>
  
  <!-- Cardinal Nodes -->
  <circle cx="32" cy="1.5" r="1.5" fill="#00E5FF"/>
  <circle cx="32" cy="62.5" r="1.5" fill="#00E5FF"/>
  <circle cx="1.5" cy="32" r="1.5" fill="#00E5FF"/>
  <circle cx="62.5" cy="32" r="1.5" fill="#00E5FF"/>

  <!-- Model 3 Hexagon Shield -->
  <path d="M32 9 L48 16 L48 38 L32 53 L16 38 L16 16 Z" fill="url(#bgShield)" stroke="url(#emGrad)" stroke-width="2.4" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Tree-Network Matrix Branches -->
  <line x1="32" y1="50" x2="32" y2="28" stroke="#34D399" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="32" y1="36" x2="24" y2="29" stroke="#34D399" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="24" y1="29" x2="24" y2="23" stroke="#00E5FF" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="24" cy="22" r="2.2" fill="#34D399" stroke="#00E5FF" stroke-width="0.6"/>
  
  <line x1="32" y1="36" x2="40" y2="29" stroke="#34D399" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="40" y1="29" x2="40" y2="23" stroke="#00E5FF" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="40" cy="22" r="2.2" fill="#34D399" stroke="#00E5FF" stroke-width="0.6"/>
  
  <!-- Center AI Camera Eye -->
  <circle cx="32" cy="27" r="6.2" fill="#064E3B" stroke="#34D399" stroke-width="1.8"/>
  <circle cx="32" cy="27" r="3.4" fill="url(#cyanG)"/>
  <circle cx="30.8" cy="25.8" r="1.2" fill="#FFFFFF"/>
</svg>
