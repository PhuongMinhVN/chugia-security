<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 70" width="360" height="70">
  <defs>
    <linearGradient id="emGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bgShieldH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E"/>
      <stop offset="100%" stop-color="#081A2E"/>
    </linearGradient>
    <linearGradient id="cyanGH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="brandGradH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glowH" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Emblem (Model 3 Crest, Scaled to 58x58 inside 70h box) -->
  <g transform="translate(6, 6)">
    <!-- Outer Guardian Circle -->
    <circle cx="29" cy="29" r="28" fill="#040914" stroke="#10B981" stroke-width="1.8"/>
    <circle cx="29" cy="29" r="25" fill="none" stroke="#00E5FF" stroke-width="0.8" opacity="0.6"/>

    <!-- Compass Cardinal Nodes -->
    <circle cx="29" cy="1" r="1.5" fill="#00E5FF"/>
    <circle cx="29" cy="57" r="1.5" fill="#00E5FF"/>
    <circle cx="1" cy="29" r="1.5" fill="#00E5FF"/>
    <circle cx="57" cy="29" r="1.5" fill="#00E5FF"/>

    <!-- Hexagon Shield -->
    <path d="M29 8 L44 14 L44 34 L29 48 L14 34 L14 14 Z" fill="url(#bgShieldH)" stroke="url(#emGradH)" stroke-width="2.2" stroke-linejoin="round" filter="url(#glowH)"/>

    <!-- Tree-Network Matrix Branches -->
    <line x1="29" y1="45" x2="29" y2="25" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
    <line x1="29" y1="32" x2="22" y2="26" stroke="#34D399" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="22" y1="26" x2="22" y2="20" stroke="#00E5FF" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="22" cy="19.5" r="2" fill="#34D399" stroke="#00E5FF" stroke-width="0.5"/>

    <line x1="29" y1="32" x2="36" y2="26" stroke="#34D399" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="36" y1="26" x2="36" y2="20" stroke="#00E5FF" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="36" cy="19.5" r="2" fill="#34D399" stroke="#00E5FF" stroke-width="0.5"/>

    <!-- Center AI Camera Eye -->
    <circle cx="29" cy="24" r="5.6" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
    <circle cx="29" cy="24" r="3" fill="url(#cyanGH)"/>
    <circle cx="28" cy="23" r="1" fill="#FFFFFF"/>
  </g>

  <!-- Typography Right (High Contrast, Works on both Light and Dark Headers) -->
  <g transform="translate(76, 12)">
    <!-- Brand Title: CHU GIA (Emerald Green) + SECURITY (White) -->
    <text x="0" y="27" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="900" fill="url(#brandGradH)" letter-spacing="-0.5">
      CHU GIA
    </text>
    <text x="115" y="27" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      SECURITY
    </text>

    <!-- Subtitle / Tagline: Since 2014 & Core Value -->
    <text x="1" y="44" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#00E5FF" letter-spacing="1.1">
      AN NINH TOÀN DIỆN • SINCE 2014
    </text>
  </g>
</svg>
